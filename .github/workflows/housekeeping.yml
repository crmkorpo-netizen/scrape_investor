name: Clean Up Old Excel Files

on:
  schedule:
    # Runs at 19:00 UTC every Tuesday (2) and Thursday (4)
    # Equivalent to 03:00 AM GMT+8 every Wednesday and Friday
    - cron: '0 19 * * 5'
  workflow_dispatch: # Keeps the manual "Run workflow" button enabled for testing
  # Run automatically whenever a file is pushed to categorize_news on main
  push:
    branches:
      - main
    paths:
      - 'categorize_news/**'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete all Excel files except the 2 newest ones
        run: |
          python3 -c '
          import glob, os, subprocess

          # Find all .xlsx and .xls files in the current directory
          files = glob.glob("*.xlsx") + glob.glob("*.xls")

          if len(files) > 2:
              # Sort files by their latest Git commit timestamp (newest first)
              files.sort(
                  key=lambda f: int(subprocess.check_output(["git", "log", "-1", "--format=%ct", "--", f]).strip() or 0),
                  reverse=True
              )
              # Keep files[0] and files[1] (the 2 newest) and delete the rest
              for old_file in files[2:]:
                  print(f"Deleting older file: {old_file}")
                  os.remove(old_file)
          else:
              print("2 or fewer Excel files found. Nothing to delete.")
          '

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Keep 2 newest Excel files and remove older ones" && git push)
