name: Weekday Notebook Execution and Save

on:
  schedule:
    # Runs Monday through Friday at 05:02 AM GMT+7 (Sun-Thu at 22:02 UTC)
    - cron: "2 22 * * 0-4"
  
  workflow_dispatch: 

# Grants write access so the runner can push the CSV and notebook updates back
permissions:
  contents: write

jobs:
  run-notebook:
    name: Run Jupyter Notebook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Clean requirements file
        run: |
          # Remove Google's broken kernel gateway fork and add the clean public version
          sed -i '/jupyter_kernel_gateway/d' requirements.txt
          echo "jupyter-kernel-gateway" >> requirements.txt
          
          # Fix the spaCy model line to a standard package format
          sed -i 's|en_core_web_sm @ .*|en_core_web_sm|g' requirements.txt
          
          # Remove python-apt which always fails on GitHub Actions
          sed -i '/python-apt/d' requirements.txt

          # Optional: Remove heavy torch packages if your scraper doesn't need ML
          sed -i '/torch/d' requirements.txt 

      - name: Install Jupyter and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Notebook
        run: |
          # Executes notebook and saves the new output cells
          jupyter nbconvert --to notebook --execute --inplace try_investor.ipynb

      - name: Commit and Push CSV and Notebook Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Stage the updated notebook and ALL generated or changed CSV files
          git add try_investor.ipynb
          git add *.csv
          
          # Only commit and push if the CSV or notebook actually changed
          if ! git diff --cached --quiet; then
            git commit -m "Automated run: updated notebook and CSV output [skip ci]"
            git push
          else
            echo "No changes in CSV or notebook. Skipping push."
          fi
