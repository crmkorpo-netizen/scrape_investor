name: Weekday Notebook Execution and Save

on:
  schedule:
    # Runs Sunday through Friday at 05:02 AM GMT+7 (Sun-Fri at 22:02 UTC)
    - cron: "2 22 * * 0-5"
  
  workflow_dispatch: 

# Grants write access so the runner can push the CSV and notebook updates back
permissions:
  contents: write

jobs:
  run-notebook:
    name: Run Jupyter Notebook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Clean requirements file
        run: |
          # 1. Remove Google's broken kernel gateway fork and add the clean public version
          sed -i '/jupyter_kernel_gateway/d' requirements.txt
          echo "jupyter-kernel-gateway" >> requirements.txt
          
          # 2. Strip the spaCy model line completely to prevent index errors
          sed -i '/en_core_web_sm/d' requirements.txt
          
          # 3. Remove niche/system/graphics/desktop libraries that fail to compile
          sed -i '/python-apt/d' requirements.txt
          sed -i '/audioop-lts/d' requirements.txt
          sed -i '/cpsat-logutils/d' requirements.txt
          sed -i '/cyipopt/d' requirements.txt
          sed -i '/dbus-python/d' requirements.txt
          sed -i '/^jax/d' requirements.txt
          sed -i '/orloge/d' requirements.txt
          sed -i '/PuLP/d' requirements.txt
          sed -i '/pycairo/d' requirements.txt
          sed -i '/PyGObject/d' requirements.txt
          sed -i '/rpy2/d' requirements.txt
          sed -i '/^shap==/d' requirements.txt
          sed -i '/spint/d' requirements.txt
          sed -i '/tobler/d' requirements.txt
          sed -i '/xgboost/d' requirements.txt
          
          # 4. Remove all PyTorch and NVIDIA CUDA environment packages
          sed -i '/^torch/d' requirements.txt
          sed -i '/^nvidia/d' requirements.txt
          
          # 5. STRIP TENSORFLOW AND KERAS HEAVY ML FRAMEWORKS TO FREE DISK SPACE
          sed -i '/^tensor/d' requirements.txt
          sed -i '/^keras/d' requirements.txt
          
          # 6. Remove geospatial map libraries entirely
          sed -i '/^GDAL==/d' requirements.txt
          sed -i '/geemap/d' requirements.txt
          sed -i '/giddy/d' requirements.txt
          sed -i '/pyproj/d' requirements.txt
          sed -i '/rasterio/d' requirements.txt
          sed -i '/rasterstats/d' requirements.txt
          sed -i '/shapely/d' requirements.txt
          
          # 7. Relax mathematical / data structural versions for Python 3.11
          sed -i 's/Mako==1.3.2.dev0/Mako>=1.3.2/g' requirements.txt
          sed -i 's/networkx==3.7/networkx>=3.0/g' requirements.txt
          sed -i 's/PyWavelets==1.10.0/PyWavelets>=1.5.0/g' requirements.txt
          sed -i 's/quantecon==0.13.1/quantecon>=0.6.0/g' requirements.txt
          sed -i 's/contourpy==1.4.0/contourpy>=1.2.0/g' requirements.txt
          sed -i 's/tifffile==2026.10.15/tifffile>=2024.1.1/g' requirements.txt
          sed -i 's/xarray-einstats==0.11.0/xarray-einstats>=0.7.0/g' requirements.txt

      - name: Install Jupyter and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert ipykernel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Notebook
        run: |
          # Executes notebook and saves the new output cells
          jupyter nbconvert --to notebook --execute --inplace try_investor.ipynb

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if any CSV files exist before attempting to stage them
          if ls *.csv 1> /dev/null 2>&1; then
            git add *.csv
            git commit -m "Automated data update"
            git push
          else
            echo "No CSV files found to commit."
          fi

