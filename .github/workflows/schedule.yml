name: Weekday Notebook Execution and Save

on:
  schedule:
    # Runs Sunday through Friday at 05:02 AM GMT+7 (Sun-Fri at 22:02 UTC)
    - cron: "2 22 * * 0-5"
  workflow_dispatch:

# Grants write access so the runner can push the CSV and notebook updates back
permissions:
  contents: write

jobs:
  run-notebook:
    name: Run Jupyter Notebook
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo add-apt-repository universe -y
        sudo apt-get update
        sudo apt-get install -y coinor-libipopt-dev gfortran pkg-config

    - name: Install Jupyter and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nbconvert ipykernel
        if [ -f requirements.txt ]; then 
          pip install -r requirements.txt; 
        fi

    - name: Execute Notebook
      run: |
        # Executes notebook and saves the new output cells
        jupyter nbconvert --to notebook --execute --inplace try_investor.ipynb

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Check if any CSV files exist before attempting to stage them
        if ls *.csv 1> /dev/null 2>&1; then 
          git add *.csv
          git commit -m "Automated data update"
          git push
        fi
