name: Weekday Notebook Execution and Save

on:
  schedule:
    # Runs Sunday through Thursday at 22:02 UTC (Monday through Friday at 05:02 AM GMT+7)
    - cron: "2 22 * * 0-4"
  workflow_dispatch:

# Grants write access so the runner can push the CSV and notebook updates back
permissions:
  contents: write

jobs:
  run-notebook:
    name: Run Jupyter Notebook
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo add-apt-repository universe -y
        sudo apt-get update
        sudo apt-get install -y coinor-libipopt-dev gfortran pkg-config

    - name: Install Jupyter and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nbconvert ipykernel
        if [ -f requirements.txt ]; then 
          pip install -r requirements.txt; 
        fi

    - name: Execute Notebook
      run: |
        # Executes notebook, updates the cell outputs inside it, and prevents fallback errors
        jupyter nbconvert --to notebook --execute --inplace try_investor.ipynb

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Stage the updated notebook file
        git add try_investor.ipynb
        
        # Stage any CSV files if they exist
        if ls *.csv 1> /dev/null 2>&1; then 
          git add *.csv
         Harlow
        fi
        
        # Commit only if there are actual structural changes to push
        if ! git diff --cached --quiet; then
          git commit -m "Automated data and notebook execution update [skip ci]"
          git push
        else
          echo "No changes detected in the notebook or data files. Skipping commit."
        fi
